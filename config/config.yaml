# =============================================================
# Project Configuration
# Autonomous Agentic Biomedical Research Environment
# All scripts must reference keys here — no hard-coded paths.
# =============================================================

project:
  name: "biomedical_agentic_lab"
  version: "0.1.0"
  description: "Autonomous agentic biomedical research environment on Apple M4 Max"
  license_data: "CC-BY-4.0"
  license_code: "MIT"
  pi: "Jarrett Evans"
  contact: "jevans2532@gmail.com"

# -------------------------------------------------------------
# Directory layout (relative to project root)
# -------------------------------------------------------------
dirs:
  data_raw:       "data/raw"
  data_processed: "data/processed"
  data_external:  "data/external"
  results:        "results"
  figures:        "results/figures"
  tables:         "results/tables"
  models:         "results/models"
  logs:           "logs"
  provenance:     "provenance"

# -------------------------------------------------------------
# Hardware / Compute
# -------------------------------------------------------------
hardware:
  device: "mps"                  # mps | cpu | cuda
  precision: "float32"           # float32 preferred on MPS
  # Mac Studio / M4 Max = 36GB unified (sysctl hw.memsize = 38654705664).
  # Corrected 2026-07-28; this key previously read 120 ("headroom below 128GB"),
  # which was never true. See markdowns/assessment_pipeline_memory_efficiency.md.
  max_memory_gb: 30              # usable budget, leaving ~6GB for OS + MPS
  mps_watermark_ratio: 0.0       # PYTORCH_MPS_HIGH_WATERMARK_RATIO

resources:
  default_threads: 8
  # NOTE: mem_mb only gates Snakemake's scheduler; it does not cap a process's
  # actual RAM on a local run. Never set above 36000 — it cannot be satisfied.
  default_mem_mb: 28000
  gpu_threads: 1                 # MPS is single-device

# -------------------------------------------------------------
# Single-Cell RNA-seq defaults
# -------------------------------------------------------------
scrna:
  min_genes: 200
  max_genes: 6000
  min_cells: 3
  max_pct_mito: 20
  n_top_genes: 3000              # highly variable genes
  n_latent: 30                   # scVI latent dimensions
  n_layers: 2
  batch_key: "batch"
  random_seed: 0
  # CNV malignancy: cells per row-block (bounds peak RAM). Each block is
  # chunk_size x n_genes float32, and the loop holds ~2 blocks at once:
  # 50000 x 24048 x 4B = 4.8 GB/block => ~9.6 GB working set, sized for the
  # phantom 128GB budget. 10000 => ~1.0 GB/block, ~2 GB working set.
  cnv_chunk_size: 10000
  # --- CNV malignancy calling (rebuilt 2026-08-05; defect D4) ---------------
  # Window is applied WITHIN a chromosome; it never straddles a contig boundary.
  cnv_window: 100
  # Clip centred expression before smoothing so a few extreme genes cannot be
  # read as a copy-number event (standard infercnv practice).
  cnv_clip: 3.0
  # Malignant when the cell's genome-wide profile spread exceeds the reference
  # mean by this many reference SDs. Reference cells are non-malignant by
  # construction, so this controls the false-positive rate on known normals.
  cnv_threshold_sd: 2.0
  # A second, more sensitive threshold producing `is_malignant_suspected`.
  # `is_malignant` builds the tumor compartment, so its false positives become
  # tumor cells; a compartment that must be clean (nerve) has the opposite error
  # cost and should drop anything merely suspected. One shared threshold cannot
  # be right for both. Set equal to cnv_threshold_sd to disable the distinction.
  cnv_exclusion_sd: 2.0
  # Reference ("normal") population. Was cell_type_predicted in {t_cell,
  # endothelial} — read from the same annotation this rule should be independent
  # of, and in the capped arm `endothelial` was never assigned at all, silently
  # degrading the reference to T cells only. Immune cells are the cleanest
  # non-malignant population available (audited at 99.5% pure).
  cnv_reference_labels: ["microglia", "macrophage", "t_cell", "nk_cell", "dc", "neutrophil"]
  # Diagnostic aneuploidy contrast. A genome-wide "spread" score conflates copy
  # number with cell-type identity — measured here, normal neural cells scored
  # HIGHER than malignant ones (0.063 vs 0.057) because an oligodendrocyte
  # differs from an immune reference across whole chromosomes for reasons that
  # have nothing to do with dosage. Contrasting a gain against a loss cancels
  # that baseline, since both are measured inside the same cell.
  #
  # +7/-10 is a WHO 2021 diagnostic criterion for IDH-wildtype glioblastoma, and
  # it also emerges unprompted from this cohort as the single most-up and
  # most-down contig in Census-malignant cells (chr7 +0.043, chr10 -0.038).
  # Measured effect: AUC 0.859 -> 0.958; at cnv_threshold_sd 2.0 the caller goes
  # from precision 0.62 / recall 0.40 to precision 0.93 / recall 0.90.
  #
  # Disease-specific by construction. A cohort with no canonical signature sets
  # both lists to [] and falls back to the genome-wide spread.
  cnv_gain_contigs: ["7"]
  cnv_loss_contigs: ["10"]
  # Keep only the most confidently-called reference cells (drop the bottom
  # quantile of cell_type_confidence). 0 disables.
  cnv_reference_confidence_quantile: 0.25
  cnv_min_reference_cells: 500
  # Refuse to run if fewer than this fraction of genes carry real coordinates.
  cnv_min_genes_placed_fraction: 0.80

# -------------------------------------------------------------
# Proteomics defaults
# -------------------------------------------------------------
proteomics:
  fdr_threshold: 0.01
  min_peptides: 2
  enzyme: "trypsin"
  missed_cleavages: 2
  mass_tolerance_ppm: 20

# -------------------------------------------------------------
# FAIR metadata defaults
# These are written into every artifact's metadata block
# -------------------------------------------------------------
fair:
  ontology_gene: "ensembl"       # gene ID namespace
  ontology_protein: "uniprot_ac"
  ontology_operation: "EDAM"
  metadata_schema: "bioschemas"
  provenance_format: "prov-json"

# -------------------------------------------------------------
# External databases
# -------------------------------------------------------------
databases:
  cellxgene_census_version: "stable"
  ensembl_release: 113
  uniprot_release: "2024_06"

# -------------------------------------------------------------
# GDC loom data (TCGA GBM)
# -------------------------------------------------------------
loom_manifest: "data/raw/gdc_extract/MANIFEST.txt"
loom_dir:      "data/raw/gdc_extract"

# -------------------------------------------------------------
# Gene-ID → symbol cache (MyGene.info)
# Loom files use versioned Ensembl IDs; marker scoring uses HGNC symbols.
# Cache is built once per Ensembl release and reused across all samples.
# -------------------------------------------------------------
gene_symbol_map:
  cache_tsv:       "data/external/mygene_ensembl_to_symbol.tsv"
  chunk_size:      1000              # MyGene recommends ≤1000 per POST
  request_timeout: 60                # seconds

samples:
  - 06820e2c-9eb7-4e71-a1c3-976d561e659d
  - 08418175-0464-4b33-86e3-416c30189bd2
  - 18d92af9-a7d0-47f2-84e2-6f4cc0dee298
  - 20e86156-cdd7-4bea-8b17-2e630720df44
  - 21521784-3a62-4989-bd29-0f920e1eaa2b
  - 44dcf3b7-977a-410f-8901-412697377924
  - 4a0d48cd-1c46-4d59-b4b0-ae842bf1323c
  - 5212fe36-192c-44a3-88f4-4c6e696b583c
  - 7eac574d-04fa-435d-8b4d-35da0100ecb9
  - 8c0685b3-521e-45a6-9677-f8e3f186e09b
  - 903b7af4-a936-4c0e-8cff-87085c3faa31
  - 9079231e-6906-4548-9f4f-684a86ed9b16
  - 9f0f5520-2bc4-47ba-9966-0831f11ae5fd
  - ae4dc06f-fc6d-4557-9a22-ab81504c2953
  - c8ea9c15-368d-460c-9775-5037a5f1790a
  - da98ea54-62c1-4b95-acaa-1dcd98e53c12
  - f8b54be7-f58e-4881-9147-40df9cef487b

# -------------------------------------------------------------
# Replication cohorts (cohort-namespaced parallel track)
# Each entry runs its OWN end-to-end scVI/scANVI pipeline under a per-dataset
# namespace (data/processed/<dataset>/, results/{models,tables,figures}/<dataset>/,
# provenance/<dataset>/). The reference cohort above (top-level `samples:`) is
# NEVER re-run — see workflow/rules/datasets.smk and the cohort_concordance step.
# The nerve/immune marker panels, scrna:, and nerve_scanvi: blocks are shared
# defaults; only freeze/override files are per-dataset (off for replication).
# Sample list is a committed sheet (data/raw/<dataset>/samples.txt), generated
# once by scripts/derive_dataset_sample_sheet.py (it must exist at parse time).
# -------------------------------------------------------------
datasets:
  gbm_cellxgene_56c4912d:
    description: "CELLxGENE Census GBM 10x replication cohort — single largest study"
    disease: "glioblastoma"
    source: "h5ad"                                     # gdc_loom | h5ad | mtx | cellxgene_census
    raw_file: "cellxgene_data/gbm_10x_raw.h5ad"        # single file, not a dir
    filter: { dataset_id: "56c4912d-2bae-4b64-98f2-af8a84389208" }
    gene_id_type: "ensembl"          # .var feature_id = Ensembl; feature_name = symbol
    sample_key: "donor_id"           # donor == sample; samples auto-derived to samples.txt
    subsample_per_donor: 5000        # per-donor cap; random_state = scrna.random_seed
    batch_key: "sample_id"           # = donor_id (within-study batch covariate)
    freeze_nerve_subset: false       # replication cohort → fresh cut, no reference freezes
    freeze_cl15_split: false

  # ---------------------------------------------------------------------------
  # Uncapped variant of the cohort above: same study, same donors, no per-donor
  # subsample. 1,020,902 cells instead of 614,951.
  #
  # This is a SEPARATE namespace on purpose. Raising the cap in-place would
  # overwrite gbm_cellxgene_56c4912d's 77 GB of artifacts and destroy the
  # capped cohort as a comparison arm. Everything here writes to
  # data/processed/gbm_cellxgene_56c4912d_full/ and results/*/gbm_cellxgene_56c4912d_full/.
  #
  # Feasibility (measured, see markdowns/assessment_pipeline_memory_efficiency.md):
  #   X at 1.02M cells x 24,048 genes ~= 2.04e9 nnz -> ~16.3 GB in memory (int32
  #   indices still legal, 2.04e9 < 2**31). Fits in 36 GB only because
  #   scrna_integration no longer holds the per-sample list and no longer
  #   duplicates .X into a counts layer.
  #
  # Before running: data/raw/gbm_cellxgene_56c4912d_full/samples.txt must exist
  # (Snakefile needs it at parse time). Generate with:
  #   python scripts/derive_dataset_sample_sheet.py gbm_cellxgene_56c4912d_full
  # ---------------------------------------------------------------------------
  gbm_cellxgene_56c4912d_full:
    description: "CELLxGENE Census GBM 10x — single largest study, UNCAPPED (full 1.02M cells)"
    disease: "glioblastoma"
    source: "h5ad"
    raw_file: "cellxgene_data/gbm_10x_raw.h5ad"
    filter: { dataset_id: "56c4912d-2bae-4b64-98f2-af8a84389208" }
    gene_id_type: "ensembl"
    sample_key: "donor_id"
    subsample_per_donor: null        # no cap — this is the whole point of this arm
    batch_key: "sample_id"
    freeze_nerve_subset: false
    freeze_cl15_split: false

# -------------------------------------------------------------
# Nerve cell heterogeneity analysis
# -------------------------------------------------------------
nerve_cells:
  leiden_resolution: 1.0
  include_astrocytes: true
  # v1.2.0 panel-tightening insulator. Anchors the nerve-subset cell roster to
  # the v1.1.0 cut so the ependymal-panel change below does not cascade through
  # cell_type_predicted → nerve_cell_subset → nerve_leiden cluster IDs. Set to
  # null (or remove the key) when a future cut is prepared to absorb a cluster
  # renumber + full failing-cluster-diagnosis refresh. Regenerate the file via
  # scripts/freeze_nerve_subset_v1_1_0.py against the v1.1.0 tag artifact.
  # SHA256 (v1.1.0 freeze): 26ea29171a6807efa6a7ed05c18cbc60578f3434f76033bb56a06677d8581a79
  #
  # v1.3.0 verification (backlog 2.2 assessment): applying the live
  # nerve_cell_subset filter (cell_type_predicted ∈ cell_types & ~is_malignant)
  # to the current malignancy_labeled.h5ad — which already carries the v1.2.0
  # tightened-panel cell_type_predicted — reproduces this frozen roster EXACTLY:
  # 106,603 live == 106,603 frozen (0 added, 0 removed, 0 newly-ependymal). The
  # freeze is therefore currently a NO-OP guard: retiring it today changes no
  # cell and (nerve_leiden being deterministic) no cluster ID. KEEP it as a
  # dormant safety net; retire only when a change legitimately alters the roster
  # — adding/removing a sample, changing QC/malignancy thresholds, or changing
  # the annotation marker sets enough to reclassify boundary cells. See
  # CHANGELOG.md [2026-05-25] backlog-2.2 assessment.
  frozen_subset_file: "provenance/nerve_subset_v1_1_0.txt"
  # CANONICAL labels — these must match exactly what scrna_annotate emits (i.e.
  # the panel names in nerve_cells.markers / annotation_markers). Matching is
  # exact after case/underscore normalization, and any entry that matches no
  # observed label now hard-fails the rule.
  #
  # "oligodendrocyte precursor cell" used to sit here while annotate emitted
  # "opc"; neither is a substring of the other, so the old substring match
  # dropped 70,881 cells in silence (defect D5).
  #
  # `astrocyte` and `opc` are DELIBERATELY ABSENT (researcher decision,
  # 2026-08-05). Measured against the Census author annotation on a 60k-cell
  # subsample of the full arm, the non-malignant cells carrying each label are:
  #
  #     oligodendrocyte    90.2% truly neural
  #     excitatory_neuron  84.2%
  #     neuron             61.5%
  #     opc                18.9%   <-- excluded
  #     astrocyte          10.0%   <-- excluded
  #
  # These two supply ~70% of the residual contamination. They are the AC-like and
  # OPC-like malignant states that share GFAP/PTPRZ1/SLC1A3 with normal glia, and
  # that GBM study authors label "malignant cell" — Census reports 347 astrocytes
  # in 1,006,344 cells (0.03%) against the ~1.5% this panel calls. The CNV caller
  # does not remove them because they are genuinely CNV-quiet on +7/-10, and
  # tightening the cut does not help: at 0 SD the compartment is still only 78%
  # neural and has lost 58% of its true neural cells.
  #
  # KNOWN COST: OPCs are a real neural population (21,460 cells in the full arm)
  # and relevant to neuron-glia-tumor crosstalk. They remain annotated and
  # present in every artifact — they are excluded from THIS COMPARTMENT only.
  # Their absence from the interaction tables is a masking decision, not a
  # biological finding, and must be reported as such.
  #
  # SECOND EXCLUSION (researcher decision, 2026-08-06): generic `neuron` and
  # `ependymal` also removed, on FULL-ARM evidence rather than the subsample.
  # Measured against Census on all 1,006,344 cells, the non-malignant cells
  # carrying each label were:
  #
  #     inhibitory_neuron  99.5% truly neural
  #     oligodendrocyte    95.8%
  #     excitatory_neuron  83.9%
  #     neuron (generic)   40.6%   <-- excluded
  #     ependymal          31.6%   <-- excluded
  #
  # The subsample had predicted a different culprit; on the full arm the two
  # LEAST SPECIFIC panels carry nearly all the contamination. Generic `neuron`
  # (SYN1/SNAP25/STMN2/RBFOX3/MAP2/SYT1) is pan-neuronal and is won by malignant
  # cells running neurodevelopmental programmes — a well-documented GBM state.
  # `ependymal` has no Census counterpart at all, so it cannot be checked, and
  # 68% of what it selects is Census-malignant.
  #
  # Result: 74.1% -> 95.4% neural at n=37,945, which lands almost exactly on the
  # Census truth for this arm (oligodendrocyte 34,160 + neuron 3,401 = 37,561).
  #
  # KNOWN COST: 8,290 Census-neural cells that only the loose panels caught are
  # lost, and "neuron" in the interaction tables now means SUBTYPE-CONFIRMED
  # excitatory/inhibitory neurons only. Both panels remain scored and present in
  # every artifact — again a masking decision, not a biological finding.
  cell_types:
    - "excitatory_neuron"
    - "inhibitory_neuron"
    - "oligodendrocyte"
  # Carried as their own LIANA group rather than per-cluster: ~4.3k neurons
  # across 170 donors is a group, not a cluster set.
  neuron_labels:
    - "excitatory_neuron"
    - "inhibitory_neuron"
  # Which malignancy flag excludes a cell from this compartment. See
  # scrna.cnv_* — `is_malignant` is the balanced call that BUILDS the tumor
  # compartment; `is_malignant_suspected` is the more sensitive flag, which
  # trades tumor recall for nerve purity.
  malignant_flag: "is_malignant"
  markers:
    neuron:
      - "SYN1"
      - "SNAP25"
      - "STMN2"
      - "RBFOX3"
      - "MAP2"
      - "SYT1"
    excitatory_neuron:
      - "SLC17A7"
      - "CAMK2A"
      - "GRIN2B"
    inhibitory_neuron:
      - "GAD1"
      - "GAD2"
      - "SLC32A1"
    opc:
      - "PDGFRA"
      - "CSPG4"
      - "SOX10"
      - "OLIG1"
    oligodendrocyte:
      - "MBP"
      - "MOG"
      - "PLP1"
      - "OLIG2"
    astrocyte:
      - "GFAP"
      - "S100B"
      - "AQP4"
      - "VIM"
    # Motile-ciliated cells lining the ventricles. Added in v1.1.0 after the
    # failing-cluster diagnosis identified cl19 as ependymal (DNAH/CFAP-dominated
    # markers) mislabeled as astrocyte. Tightened in v1.2.0: FOXJ1 dropped
    # (absent from var_names — filtered upstream of HVG selection) and RFX3
    # dropped (broadly expressed across astrocyte clusters at 61–97%, not
    # discriminating). PIFO retained for intent even though also absent from
    # current var_names. See markdowns/failing_cluster_diagnosis.md
    # v1.1.0-supplement and results/tables/cl15_ependymal_diagnosis.json.
    ependymal:
      - "DNAH7"
      - "DNAH9"
      - "DNAH11"
      - "CFAP54"
      - "PIFO"
      - "RSPH1"
  reference_dataset: "cellxgene_census"
  # v1.3.0 cl15 surgical sub-cluster split. The v1.2.0 rerun confirmed that
  # ependymal-panel methodology alone could not resolve cl15's MIXED status
  # (cluster-level argmax is robust to per-cell score shifts), so cl15 is split
  # into its four sub-Leiden subpopulations. The per-barcode assignment is
  # frozen in the CSV below (generated once by scripts/freeze_cl15_split_v1_3_0.py,
  # SHA256 0bfc2e2650f9500904ea9bb96285d3ad15320b08b664d715caa9055f258ff39c) and
  # applied AFTER nerve_leiden in nerve_cell_subset.py — only the listed cl15
  # barcodes are relabeled, so every other cluster's ID (and its v1.0.0 verdict)
  # stays bit-exact. new_clusters is informational FAIR metadata; the CSV is the
  # source of truth. Remove this block to retire the split. cl27 (immune tail) is
  # added to batch_qc.exclude_clusters below, cl21-style.
  cluster_overrides:
    split_assignments_file: "provenance/cl15_split_v1_3_0.csv"
    new_clusters:
      "24": {source: "cl15.sub-1", cell_type: ependymal,    n: 692, markers: [CFAP54, DNAH6, DNAH7, PACRG]}
      "25": {source: "cl15.sub-0", cell_type: neuron,       n: 773, markers: [NAV3, SCN1A, NRXN3]}
      "26": {source: "cl15.sub-3", cell_type: transitional, n: 378, markers: [MALAT1, LSAMP, NFIA]}
      "27": {source: "cl15.sub-2", cell_type: artifact,     n: 11,  markers: [PTPRC, SKAP1, ARHGAP15]}
  batch_qc:
    # Cluster passes if its largest single-sample fraction is below this:
    dominant_fraction_max: 0.5
    # Sample counted as "contributing" if it provides at least this fraction of cluster cells:
    min_contributing_fraction: 0.01
    # Cluster also requires at least this many contributing samples to pass:
    min_contributing_samples: 3
    # Clusters identified as technical artifacts (e.g. dissociation stress) by
    # markdowns/failing_cluster_diagnosis.md — annotate_cluster_qc drops their
    # rows from the _with_qc.csv variants. Source per-cluster tables are
    # untouched so the audit trail of the artifact is preserved.
    exclude_clusters:
      - "21"  # dissociation stress (MT-RNR2/MT-RNR1/MT-CO1/RPL41/RPS12 markers; n_genes=1099)
      - "27"  # v1.3.0 cl15.sub-2 immune tail (n=11; PTPRC/SKAP1/ARHGAP15) — artifact, dropped from _with_qc tables

# -------------------------------------------------------------
# Tumor-associated immune compartment subclustering
# The whole-dataset annotation lumps all myeloid/lymphoid cells into a single
# "microglia" argmax group (coarse Leiden resolution). Re-subset those cells and
# re-cluster on the existing scVI latent to resolve immune subtypes for the
# nerve-tumor-immune interaction analysis. Marker availability verified in
# malignancy_labeled.h5ad (20,420-gene matrix): microglia 6/7, TAM 6/6,
# T-cell 4/6, NK 2/3, DC 2/4 symbols present. No model retraining — reuses
# X_scVI from scrna_integration. GBM is immune-cold, so T/NK/DC clusters may be
# small; add genuinely artifactual clusters to batch_qc.exclude_clusters after
# inspecting immune_cluster_composition.csv.
# -------------------------------------------------------------
immune_cells:
  leiden_resolution: 1.0             # tune upward if subtypes under-split
  # Was a single string, "microglia" — correct only while the annotation had no
  # myeloid panels and lumped every immune cell into one argmax bucket (which is
  # why the immune mask measured 99.5% pure). With per-lineage panels now in
  # annotation_markers, those cells get their own labels and would fall out of
  # this compartment entirely; the purity gate would still pass, because purity
  # is not a size check. Hence a list, plus compartment_audit's size gate.
  # `source_label` (str) is still honored for backward compatibility.
  source_labels:
    - "microglia"
    - "macrophage"
    - "t_cell"
    - "nk_cell"
    - "b_plasma"
    - "neutrophil"
    - "dc"
    - "mast"
  subtype_markers:
    microglia:  ["P2RY12", "CX3CR1", "TMEM119", "AIF1", "C1QA", "C1QB", "C1QC"]
    tam:        ["CD68", "CD163", "MRC1", "MARCO", "LYVE1", "F13A1"]
    t_cell:     ["CD2", "CD3D", "CD3E", "CD8A", "CD4", "IL7R"]
    nk_cell:    ["GNLY", "KLRD1", "NKG7"]
    dendritic:  ["FLT3", "LAMP3", "CLEC9A", "FCER1A"]
  batch_qc:
    # Same purity semantics as nerve_cells.batch_qc (see fair_utils.compute_cluster_purity).
    dominant_fraction_max: 0.5
    min_contributing_fraction: 0.01
    min_contributing_samples: 3
    # Populate after inspecting immune_cluster_composition.csv — patient-driven
    # or vanishingly small immune_leiden clusters (informational; the subset-level
    # purity table records them).
    exclude_clusters: []
    # Immune SUBTYPE labels dropped from the three-way _with_qc.csv interaction
    # tables (the interaction groups immune cells by subtype, not by leiden id).
    # e.g. drop a subtype that is a doublet/artifact call. Default: keep all.
    exclude_subtypes: []

# -------------------------------------------------------------
# Environment enforcement guard (conda_env_smoke_test)
#
# Canaries for the venv-shadowing defect. igraph and torch are the useful ones:
# the venv carries its own igraph and anaconda base a third copy, so agreement
# here means the WHOLE declared env is enforced, not just the packages an
# earlier hotfix happened to install. Must match workflow/envs/scrna.yaml.
# -------------------------------------------------------------
env_enforcement:
  expected_versions:
    igraph: "0.11.8"
    torch: "2.12.0"
    scanpy: "1.12.1"
    anndata: "0.12.10"
    liana: "1.7.1"
    infercnvpy: "0.4.3"

# -------------------------------------------------------------
# Ensembl gene coordinates for CNV inference
#
# CNV callers detect malignancy from runs of co-elevated/co-depressed expression
# across neighbouring loci, so genes must be in genomic order. Nothing else in
# this project carries coordinates: Census .var has feature_id / feature_name /
# feature_length only, and dataset_gene_symbol_map.py writes the literal string
# "unknown" into its `chromosome` column. scrna_malignancy previously ordered by
# the numeric suffix of the Ensembl accession — a counter, not a coordinate.
#
# After the first successful run, copy the sha256 emitted in
# gene_positions_manifest.json into `sha256:` below and commit, so later runs
# verify against a fixed digest (same convention as msigdb:).
# -------------------------------------------------------------
gene_positions:
  release: 113                      # must match databases.ensembl_release
  download_dir: "data/external/ensembl"
  gtf_filename: "Homo_sapiens.GRCh38.113.gtf.gz"
  url: "https://ftp.ensembl.org/pub/release-113/gtf/homo_sapiens/Homo_sapiens.GRCh38.113.gtf.gz"
  positions_filename: "ensembl113_gene_positions.tsv"
  sha256: "62f1709b40e083ce9d4cdc64a86b5ffec2c5d5371434bb7095c74dc89079c466"
  request_timeout: 300
  max_retries: 5

# -------------------------------------------------------------
# Whole-cohort annotation marker panels (scrna_annotate ONLY)
#
# Deliberately separate from `nerve_cells.markers`. That block is also read by
# scrna_qc (to set is_nerve_marker) on every per-sample job — 170 donors x 2
# arms — so editing it invalidates every QC artifact and cascades into the 11 h
# scVI train. It is also semantically wrong: CD163/MRC1 are not nerve markers.
# Panels here are merged over nerve_cells.markers and win on conflict.
#
# Why these exist at all: before this block, the only non-neural panels were
# four hardcoded in scrna_annotate.py (microglia, t_cell, endothelial,
# tumor_gbm). Every macrophage, mural, mast, B, NK, neutrophil and DC in the
# cohort therefore had nowhere to go and was forced into the nearest neural
# panel — which is how the "nerve" compartment ended up 27.5% myeloid. A panel
# per lineage gives those cells somewhere true to land. Defect D3.
#
# leiden_resolution: annotate clusters 1M cells; at res 1.0 that is 47 clusters,
# and cluster-level argmax then averages genuinely different populations
# together (cluster 4 = 70,881 cells, 82.5% malignant, labelled 'opc'). 2.0
# splits them finely enough to be callable. Kept separate from
# nerve_cells.leiden_resolution, which governs a different clustering pass
# inside the nerve subset and must not move with it.
# -------------------------------------------------------------
annotation_markers:
  leiden_resolution: 2.0
  # Cluster is labelled 'ambiguous' when its best and second-best panel z-scores
  # differ by less than this AND the two panels sit in different compartments.
  # Forcing a call on an indistinguishable margin is what downstream code then
  # trusts as fact — but only cross-compartment ties actually threaten
  # compartment integrity. A macrophage-vs-neutrophil tie lands in the immune
  # compartment either way, so calling it 'ambiguous' would discard a correctly
  # placed immune cell for no gain; a tumor_gbm-vs-astrocyte tie is exactly the
  # confusion that produced this whole defect and must be surfaced.
  ambiguous_margin: 0.10
  panel_compartment:
    neuron: neural
    excitatory_neuron: neural
    inhibitory_neuron: neural
    opc: neural
    oligodendrocyte: neural
    astrocyte: neural
    ependymal: neural
    microglia: immune
    macrophage: immune
    t_cell: immune
    nk_cell: immune
    b_plasma: immune
    neutrophil: immune
    dc: immune
    mast: immune
    endothelial: vascular
    mural: vascular
    tumor_gbm: malignant
  panels:
    # --- annotation-only override of a neural panel ---
    # VIM is expressed across AC-like and MES-like malignant cells, so the
    # original GFAP/S100B/AQP4/VIM panel cannot separate a normal astrocyte from
    # a tumor cell. Replaced with transporter/enzyme markers specific to mature
    # astrocytes. nerve_cells.markers.astrocyte is intentionally left unchanged.
    astrocyte:   ["GFAP", "S100B", "AQP4", "SLC1A2", "SLC1A3", "ALDH1L1", "GJA1"]
    # --- non-neural panels (previously hardcoded in scrna_annotate.py) ---
    microglia:   ["AIF1", "CX3CR1", "TMEM119", "P2RY12", "PTPRC"]
    t_cell:      ["CD3D", "CD3E", "CD4", "CD8A", "CD8B"]
    endothelial: ["PECAM1", "CDH5", "VWF", "ENG"]
    tumor_gbm:   ["SOX2", "NES", "CD44", "PROM1", "MKI67"]
    # --- newly added: the lineages with no panel at all before this ---
    macrophage:  ["CD163", "MRC1", "MSR1", "F13A1"]
    mural:       ["PDGFRB", "RGS5", "ACTA2", "DCN"]
    mast:        ["TPSAB1", "CPA3", "KIT"]
    b_plasma:    ["CD79A", "MS4A1", "MZB1"]
    nk_cell:     ["NKG7", "GNLY", "KLRD1"]
    neutrophil:  ["FCGR3B", "CSF3R", "S100A8"]
    dc:          ["FLT3", "CLEC9A", "LAMP3"]

# -------------------------------------------------------------
# Compartment integrity audit (the Test Oracle)
#
# Cross-tabulates every compartment mask (nerve / tumor / immune) against the
# CELLxGENE Census author annotation `obs['cell_type']` — harmonized to the CL
# ontology, and the only external ground truth these cohorts carry. Runs on
# existing artifacts; no re-run needed.
#
# `enforce: false` records the failing pre-fix baseline without breaking the
# pipeline. Flipped to true in Phase 4 of
# markdowns/plan_compartment_integrity_fix.md, after which any breached gate
# hard-fails the rule and blocks every downstream interaction result.
#
# Oracle caveat: Census cell_type is an external author annotation, not a
# re-derivation from these counts. It under-calls normal astrocytes (347 in a
# 1M-cell cohort) because most GBM study authors label AC-like cells "malignant
# cell". A corrected pipeline legitimately finding more astrocytes is not a
# failure — see the "Known limits" section of the plan.
# -------------------------------------------------------------
compartment_audit:
  # Undeclared sidecar for the audit tables. Snakemake deletes a failed job's
  # DECLARED outputs, which for this rule destroys the evidence exactly when a
  # gate fails and you most need it. Nothing in the DAG points here, so nothing
  # can delete it.
  sidecar_dir: "results/compartment_audit_snapshots"
  # Flipped to true in Phase 4 (2026-08-05): the fixes are in, so a breached gate
  # must now stop the pipeline rather than be recorded and passed over.
  enforce: true
  # Census CL labels → coarse class. Any observed cell_type missing from this
  # map is counted as 'unmapped' and raises a [FAIR-ALERT] in the log rather
  # than being silently folded into a class.
  census_class_map:
    neural:
      - "neuron"
      - "oligodendrocyte"
      - "oligodendrocyte precursor cell"
      - "astrocyte"
      - "radial glial cell"
      - "ependymal cell"
    malignant:
      - "malignant cell"
    myeloid:
      - "macrophage"
      - "microglial cell"
      - "monocyte"
      - "dendritic cell"
      - "neutrophil"
      - "mast cell"
    lymphoid:
      - "mature T cell"
      - "natural killer cell"
      - "B cell"
      - "plasma cell"
    vascular:
      - "endothelial cell"
      - "mural cell"
  # Classes that legitimately belong in the immune compartment.
  immune_classes: ["myeloid", "lymphoid"]
  gates:
    # Relaxed 0.85 -> 0.80 (researcher decision, 2026-08-05) at the same time as
    # astrocyte/opc were removed from nerve_cells.cell_types. Deliberate and
    # recorded, not a silently moved goalpost: the residual disagreement is with
    # an oracle that labels AC-like cells "malignant cell" and reports only 347
    # astrocytes in a 1M-cell cohort, which the plan's own "Known limits" section
    # says should not be auto-failed. Measured post-fix value on a 60k subsample
    # is 82.9%. If this ever needs relaxing again, fix the biology instead.
    nerve_neural_fraction_min:               0.80
    tumor_malignant_fraction_min:            0.85
    malignancy_recall_min:                   0.80
    malignancy_precision_min:                0.85
    immune_purity_min:                       0.95   # regression guard (pre-fix: 0.995)
    max_nerve_cluster_endothelial_fraction:  0.20   # pre-fix nerve_c24 = 0.929
    # Guards the C3 failure mode: splitting the myeloid blob into per-lineage
    # labels can drop most of the immune compartment while purity still passes,
    # because purity is not a size check.
    immune_size_fraction_of_baseline_min:    0.85
  # Per-arm expected sizes, measured in Phase 1 (2026-08-05). The capped arm has
  # no opc/ependymal labels today, so it needs its own range rather than the full
  # arm's. NOT_SET gates are reported, never silently passed.
  #
  # nerve_n bands are derived from each arm's own Census neuroglial census
  # (oligodendrocyte + OPC + neuron + radial glial + astrocyte), then widened to
  # allow for the malignancy exclusion at one end and the known astrocyte
  # under-call at the other. They are sanity bands — "did the compartment
  # collapse, or is it still full of tumor" — not tight predictions.
  per_arm:
    gbm_cellxgene_56c4912d_full:
      immune_baseline_n: 329608     # measured pre-fix; guards the C3 failure mode
      # Bands re-derived 2026-08-06 after the SECOND narrowing (generic neuron
      # and ependymal also removed). Census oligodendrocyte + neuron = 37,561;
      # measured post-fix on the full arm = 37,945. Sanity band, not a
      # prediction: it catches "the compartment collapsed" and "it is still full
      # of tumor".
      nerve_n_min:       25000
      nerve_n_max:       50000      # pre-fix compartment was 377,343
      neuron_n_min:      1500       # Census has 3,401 neurons; guards total loss
    gbm_cellxgene_56c4912d:
      immune_baseline_n: 169617
      # Census oligodendrocyte + neuron = 27,860 for this arm.
      nerve_n_min:       15000
      nerve_n_max:       40000      # pre-fix compartment was 270,520
      neuron_n_min:      1200       # Census has 2,992 neurons

# -------------------------------------------------------------
# scANVI re-train on the nerve subset (v2 model)
# Anchors latent space on marker-derived cell-type labels to
# disentangle patient identity from cell-type biology.
# -------------------------------------------------------------
nerve_scanvi:
  batch_key: "sample_id"
  # Was "cell_type" — the column nerve_celltype_labels used to overwrite. That
  # column is the CELLxGENE authors' CL-ontology annotation and the only external
  # oracle these cohorts carry (defect D6). Marker labels now go to their own
  # column and this points at it. Per-arm overridable via
  # datasets.<arm>.scanvi_labels_key so the reference cohort, whose existing
  # nerve_cells_counts_labeled.h5ad still carries the old column, is unaffected.
  labels_key: "cell_type_marker_label"
  unlabeled_category: "Unknown"
  unknown_percentile: 20.0       # cells below this percentile of max-score -> Unknown
  scvi_max_epochs: 400
  scanvi_max_epochs: 100
  n_samples_per_label: 200       # scANVI mini-batch balance across cell-types

# -------------------------------------------------------------
# Baseline provenance bundle (semver-tagged citable result set)
# Run on demand: `snakemake --use-conda freeze_baseline_provenance`
# Bump `version` and append a new `summary` line whenever the science changes.
# -------------------------------------------------------------
baseline:
  version: "v1.3.0"

  # -----------------------------------------------------------------------
  # Structural pin of the v1.3.0 reference cohort.
  #
  # `data/processed/nerve_cells.h5ad` was deleted by a failed nerve_cell_subset
  # job on 2026-07-21 and cannot be reproduced (retrained latent re-clusters, so
  # the frozen cl15 split no longer maps to one source cluster). Researcher
  # decision: pin the surviving tables, never regenerate.
  #
  # When true, the 10 rules that would rewrite the artifacts below are NOT
  # DEFINED at parse time — see workflow/rules/common.smk BASELINE_PINNED, and
  # the `if not BASELINE_PINNED:` guards in nerve_cells.smk and immune.smk. A
  # rule that does not exist cannot be scheduled, so this holds for every
  # invocation including a bare `snakemake`. Set to false to restore the full
  # reference pipeline (this WILL attempt the unreproducible rebuild).
  #
  # Deliberately NOT pinned: the scANVI-v2 chain (nerve_celltype_labels,
  # nerve_scanvi_retrain, nerve_batch_qc_v2) and the immune subset rules — all
  # reproducible from artifacts that still exist.
  #
  # Known cost: annotate_cluster_qc is pinned, so edits to
  # nerve_cells.batch_qc.exclude_clusters / immune_cells.batch_qc.exclude_subtypes
  # no longer regenerate the six *_with_qc.csv tables for this cohort.
  # -----------------------------------------------------------------------
  pinned: true

  # Every output of the 10 pinned rules that survives on disk. Source of truth
  # for freeze_pinned_reference / verify_pinned_reference (see fair.smk).
  # Lost with the failed job and therefore absent here: nerve_cells.h5ad,
  # nerve_cells_umap.png, nerve_cluster_composition.csv,
  # provenance/nerve_subset_provenance.json.
  pinned_artifacts:
    # nerve_cell_heterogeneity
    - "results/tables/nerve_cluster_markers.csv"
    - "results/tables/nerve_enrichment.csv"
    - "results/figures/nerve_dotplot.png"
    - "results/figures/nerve_abundance_heatmap.png"
    - "provenance/heterogeneity_provenance.json"
    # nerve_cluster_annotations
    - "results/tables/nerve_cluster_annotations.csv"
    - "provenance/nerve_cluster_annotations_provenance.json"
    # nerve_clinical_association
    - "results/tables/nerve_clinical_association.csv"
    - "results/figures/nerve_clinical_pvalue_heatmap.png"
    - "results/figures/nerve_clinical_boxplots.png"
    - "provenance/nerve_clinical_association_provenance.json"
    # nerve_batch_qc
    - "results/tables/nerve_cluster_sample_purity.csv"
    - "results/figures/nerve_cells_umap_by_sample.png"
    - "results/figures/nerve_cells_umap_per_sample_panel.png"
    - "provenance/nerve_batch_qc_provenance.json"
    # nerve_leiden_resolution_sweep
    - "results/tables/nerve_leiden_resolution_sweep.csv"
    - "results/figures/nerve_leiden_resolution_sweep.png"
    - "provenance/nerve_leiden_resolution_sweep_provenance.json"
    # nerve_tumor_interaction
    - "results/tables/nerve_tumor_interactions.csv"
    - "results/tables/nerve_tumor_top_pairs.csv"
    - "results/figures/nerve_tumor_sig_heatmap.png"
    - "results/figures/nerve_tumor_dotplot.png"
    - "provenance/nerve_tumor_interaction_provenance.json"
    # nerve_assemble_counts
    - "data/processed/nerve_cells_counts.h5ad"
    - "provenance/nerve_assemble_counts_provenance.json"
    # nerve_tumor_immune_interaction
    - "results/tables/nerve_tumor_immune_interactions.csv"
    - "results/tables/nerve_tumor_immune_top_pairs.csv"
    - "results/figures/nerve_tumor_immune_sig_heatmap.png"
    - "results/figures/nerve_tumor_immune_dotplot.png"
    - "provenance/nerve_tumor_immune_interaction_provenance.json"
    # annotate_cluster_qc
    - "results/tables/nerve_enrichment_with_qc.csv"
    - "results/tables/nerve_cluster_markers_with_qc.csv"
    - "results/tables/nerve_tumor_interactions_with_qc.csv"
    - "results/tables/nerve_tumor_top_pairs_with_qc.csv"
    - "results/tables/nerve_tumor_immune_interactions_with_qc.csv"
    - "results/tables/nerve_tumor_immune_top_pairs_with_qc.csv"
    - "provenance/annotate_cluster_qc_provenance.json"

  summary: |
    First reproducible baseline of the TCGA-GBM nerve-cell pipeline.
    Pipeline: GDC loom → QC → scVI integration → CNV-based malignancy labelling →
    nerve-cell subset (re-clustered on X_scVI, 24 Leiden clusters) →
    DE markers (Wilcoxon) → offline GSEA (gseapy.prerank vs MSigDB C5 GO BP+MF, v2024.1.Hs) →
    cluster annotations / clinical association / tumor–nerve LIANA interactions /
    interactive marimo enrichment explorer.
    Batch-correction QC: 18 / 24 clusters PASS (median dominant-sample fraction 0.313;
    median normalised entropy 0.722 of 4.087 bits).

    v1.1.0 deltas (2026-05-24, post failing-cluster diagnosis):
    - cl21 dropped from downstream _with_qc.csv tables via
      nerve_cells.batch_qc.exclude_clusters (dissociation artifact:
      stress-marker dominant — MT-RNR2/1, RPL41, B2M, FTH1; see
      markdowns/failing_cluster_diagnosis.md).
    - Ependymal added as 5th cell-type label (FOXJ1/RFX3/DNAH7-9-11/
      CFAP54/PIFO/RSPH1 marker set) and to nerve_cells.cell_types so
      cells pass the nerve_cell_subset filter. After re-clustering with
      the +5,713 ependymal cells, three ependymal-dominant clusters
      emerged: cl11 (72% ependymal, 2,585 cells), cl15 (89%, 1,854 cells),
      and cl19 (83%, 1,020 cells; clean motile-cilia signature CFAP54/
      DNAH7/DNAH9). cl11 and cl15 were not predicted by the cut doc;
      they represent biologically distinct ependymal subpopulations.
    - scANVI v2 retrained on 5 labels (was 4 + Unknown): astrocyte 22,600
      / neuron 20,538 / ependymal 14,545 / oligodendrocyte 14,380 /
      opc 13,219 + Unknown 21,321. Classifier accuracy 0.85 (was 0.84).
    - notebooks/02_nerve_enrichment_explorer.py: added 'ependymal' theme
      regex (CILIUM/CILIARY/AXONEMAL/DYNEIN/EPENDYM) to surface cl11/15/19
      ciliary GSEA hits in the theme roll-up.
    - v1.0.0 baseline (provenance/baseline_v1.0.0.json) remains frozen
      and citable.

    v1.2.0 deltas (2026-05-24, ependymal panel tightening + freeze insulator):
    - Ependymal panel tightened to DNAH7/DNAH9/DNAH11/CFAP54/PIFO/RSPH1.
      FOXJ1 dropped (absent from var_names, unscoreable); RFX3 dropped
      (non-discriminating, 61-97% across astrocyte clusters). PIFO retained
      for intent but also absent from var_names -> 5 effective scoring genes.
    - Freeze insulator added (nerve_cells.frozen_subset_file ->
      provenance/nerve_subset_v1_1_0.txt; SHA256 26ea29171a6807efa6a7ed05c18
      cbc60578f3434f76033bb56a06677d8581a79; 106,603 barcodes) so the panel
      change cannot cascade into cell_type_predicted -> nerve_cell_subset ->
      nerve_leiden cluster IDs. Rerun was bit-exact: 0 cells drifted,
      per-cluster sizes identical to v1.1.0 (54/54 Snakemake steps, ~5h 14m
      on M4 Max / MPS).
    - Refactor: is_nerve_marker annotation + gene_presence.csv moved from
      loom_to_h5ad to scrna_qc, so future panel changes no longer trigger
      per-sample reruns.
    - scANVI v2 retrained on tightened-panel labels: astrocyte 22,927 /
      Unknown 21,321 / neuron 20,420 / oligodendrocyte 14,358 /
      ependymal 14,280 / opc 13,297. Classifier accuracy 0.8446.
    - Panel-tightening predictions in the v1.1.0 failing_cluster_diagnosis
      supplement were partially wrong: cl15 ependymal-predicted stayed at
      90.1% (not 30-60% as forecast) and score_ependymal mean rose
      (0.193 -> 0.265). Root cause: sc.tl.score_genes is non-monotonic in
      panel size + cluster-level argmax is robust to per-cell shifts.
      cl15 MIXED-cluster finding documented; surgical sub-cluster relabel
      deferred to v1.3.0. See markdowns/DO_THIS_NEXT_post_v1.2.0_rerun.md
      and the supplement's "Post-rerun reality check" subsection.
    - v1.0.0 and v1.1.0 baselines remain frozen and citable.

    v1.3.0 deltas (cl15 surgical sub-cluster split; freeze retained):
    - cl15 (MIXED, 1,854 cells) split into four separately-labeled
      nerve_leiden IDs via nerve_cells.cluster_overrides, applied AFTER
      nerve_leiden by frozen per-barcode assignment
      (provenance/cl15_split_v1_3_0.csv, SHA256 0bfc2e2650f9500904ea9bb9
      6285d3ad15320b08b664d715caa9055f258ff39c): cl24 ependymal (sub-1,
      n=692, CFAP54/DNAH signature), cl25 neuron (sub-0, n=773,
      NAV3/SCN1A), cl26 transitional (sub-3, n=378, MALAT1/LSAMP/NFIA),
      cl27 immune artifact (sub-2, n=11, PTPRC) added to
      batch_qc.exclude_clusters. cl15 is now empty (gap retained for
      traceability); final cluster set {0-14, 16-27}.
    - The split was re-derived deterministically (sub-Leiden res=0.5 on
      X_scVI, igraph, seed 0) and reproduced the v1.1.0 evidence-pack
      sub-population sizes exactly {773,692,378,11} — the freeze is NOT
      leaking (DO_THIS_NEXT_post_v1.2.0_rerun.md falsification claim,
      lines 90-94: resolved, not triggered).
    - Freeze insulator (frozen_subset_file) RETAINED: cluster IDs 0-23
      and their v1.0.0 verdicts stay bit-exact; only cl15's cells were
      relabeled. Full freeze retirement + cluster renumber (backlog 2.2)
      deferred to v1.4.0.
    - scANVI v2 (nerve_scanvi_retrain) keys on cell_type, not nerve_leiden,
      so v2 latent/labels are unaffected by the split.
    - Failing-cluster diagnosis refreshed for the post-split set
      (markdowns/failing_cluster_diagnosis.md v1.3.0 supplement;
      results/tables/failing_cluster_diagnosis.json).
    - v1.0.0, v1.1.0, v1.2.0 baselines remain frozen and citable.

# -------------------------------------------------------------
# MSigDB gene-set collections (offline GSEA via gseapy.prerank)
# Replaces the Enrichr online API (rate-limited, non-reproducible).
# C5 GO BP+MF mirrors the prior GO_Biological_Process_2023 /
# GO_Molecular_Function_2023 Enrichr libraries.
# License: CC-BY 4.0 (MSigDB v2024+).
# After the first successful download, copy the SHA-256 emitted in
# msigdb_manifest.json into the `sha256:` fields below and commit so
# subsequent runs validate against fixed digests.
# -------------------------------------------------------------
msigdb:
  release: "2024.1.Hs"
  download_dir: "data/external/msigdb"
  request_timeout: 120
  max_retries: 5
  collections:
    gmt_bp:
      filename: "c5.go.bp.v2024.1.Hs.symbols.gmt"
      url: "https://data.broadinstitute.org/gsea-msigdb/msigdb/release/2024.1.Hs/c5.go.bp.v2024.1.Hs.symbols.gmt"
      library_label: "GO_Biological_Process_2024"
      sha256: "71df041c352cc810c11847db328bb94925c5448a009f310d224f2e8baa60b792"
    gmt_mf:
      filename: "c5.go.mf.v2024.1.Hs.symbols.gmt"
      url: "https://data.broadinstitute.org/gsea-msigdb/msigdb/release/2024.1.Hs/c5.go.mf.v2024.1.Hs.symbols.gmt"
      library_label: "GO_Molecular_Function_2024"
      sha256: "b49da24e797c31a9ec39a59a44b9cf13c29c094a33eece54132f9f25fae2d87f"
  prerank:
    top_n_per_cluster: 10        # rows kept per (cluster, library)
    min_size: 15
    max_size: 500
    permutation_num: 1000
    min_ranked_genes: 50         # skip clusters with fewer mappable symbols

# -------------------------------------------------------------
# GDC REST API configuration
# -------------------------------------------------------------
gdc_api:
  base_url: "https://api.gdc.cancer.gov"
  request_timeout: 60         # seconds per POST attempt
  max_retries: 5              # exponential backoff: 1s, 2s, 4s, 8s, 16s (~31s total)
  fields:
    - "file_id"
    - "cases.case_id"
    - "cases.project.project_id"
    - "cases.diagnoses.primary_diagnosis"
    - "cases.diagnoses.tumor_grade"
    - "cases.diagnoses.prior_malignancy"
    - "cases.diagnoses.treatments.treatment_outcome"
    - "cases.samples.tissue_type"
    - "cases.demographic.gender"
    - "cases.demographic.race"
    - "cases.demographic.age_at_index"
