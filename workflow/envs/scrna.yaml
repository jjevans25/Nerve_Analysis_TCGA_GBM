name: scrna
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
    - scanpy==1.12.1
    - anndata==0.12.10
    - scvelo==0.3.4
    - scvi-tools==1.4.2
    - pytorch-lightning==2.6.1
    - torch==2.12.0
    - torchvision==0.27.0
    - loompy==3.0.8
    - cellxgene-census==1.17.0
    - h5py==3.16.0
    - huggingface-hub==1.11.0
    - umap-learn==0.5.12
    - matplotlib==3.10.8
    - seaborn==0.13.2
    - numpy==2.3.5
    - pandas==2.3.3
    - scipy==1.17.1
    - infercnvpy==0.4.3
    - gseapy==1.1.3
    - requests==2.32.3
    # Pinned 2026-08-05. Previously unpinned (arriving transitively via scanpy /
    # umap-learn), and numba's OpenMP threading layer caused BOTH SIGSEGVs in
    # this project when sc.pp.neighbors ran after torch/MPS init. An unpinned
    # transitive dependency that can crash the pipeline is not a dependency the
    # workflow gets to leave undeclared. Every script that reaches
    # sc.pp.neighbors also sets NUMBA_THREADING_LAYER=workqueue before importing
    # scanpy; the pin makes the version that behaviour was verified against
    # explicit. Versions are the ones resolved into the current env.
    - numba==0.65.0
    - llvmlite==0.47.0
    - leidenalg==0.10.2
    - igraph==0.11.8
    - liana==1.7.1
    - decoupler==2.1.6
